[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["willctl"]
repository = "https://github.com/willctl/adytum"
publish = false

[workspace.dependencies]
adytum = { path = "crates/adytum" }
async-trait = "0.1"
getrandom = "0.3"
nix = { version = "0.28", default-features = false, features = ["signal"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync", "process", "signal", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 4

# CI fails on any warning. An exception is #[expect(lint, reason = "...")] where it is made.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
# Pedantic, less the checks below that are taste rather than bugs.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
unreadable_literal = "allow"
single_match_else = "allow"
if_not_else = "allow"
match_same_arms = "allow"
implicit_hasher = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Nothing a person or a file can reach may panic. Tests may (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# stdout is the command's output; nothing else prints there.
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
# #[expect] rather than #[allow], so an exception no longer needed shows.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
