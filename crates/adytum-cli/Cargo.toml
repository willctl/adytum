[package]
name = "adytum-cli"
description = "The adytum command, with --json on every command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "adytum"
path = "src/main.rs"

[dependencies]
adytum = { workspace = true, features = ["doctor"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
adytum = { workspace = true, features = ["testing"] }

[lints]
workspace = true
